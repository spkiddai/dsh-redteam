name: prism
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: '${PRISM_DB_PASSWORD:?Set PRISM_DB_PASSWORD in .env}'
    volumes:
      - prism-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prism -d prism']
      interval: 5s
      timeout: 5s
      retries: 10
  prism:
    build: .
    image: prism-local:1.4.0
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PRISM_PORT:-3080}:3080'
    environment:
      PRISM_DATABASE_URL: 'postgresql://prism:${PRISM_DB_PASSWORD}@db:5432/prism'
      PRISM_ORIGIN: '${PRISM_ORIGIN:-http://127.0.0.1:3080}'
      DEEPSEEK_API_KEY: '${DEEPSEEK_API_KEY:-}'
    volumes:
      - prism-data:/data
      - prism-projects:/workspace
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3080/prism-auth/state', {headers:{host:new URL(process.env.PRISM_ORIGIN).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s
volumes:
  prism-db:
  prism-data:
  prism-projects:
