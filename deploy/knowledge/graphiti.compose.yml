services:
  graphiti:
    image: zepai/graphiti:0.22.1
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${GRAPHITI_OPENAI_API_KEY:?Set GRAPHITI_OPENAI_API_KEY}
      OPENAI_BASE_URL: ${GRAPHITI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${GRAPHITI_MODEL_NAME:-gpt-4.1-mini}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:?Set GRAPHITI_NEO4J_PASSWORD}
    ports:
      - '127.0.0.1:8000:8000'

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      GRAPHITI_NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:?Set GRAPHITI_NEO4J_PASSWORD}
      NEO4J_AUTH: neo4j/${GRAPHITI_NEO4J_PASSWORD:?Set GRAPHITI_NEO4J_PASSWORD}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${GRAPHITI_NEO4J_PASSWORD}" "RETURN 1" >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - '127.0.0.1:7474:7474'
    volumes:
      - graphiti_neo4j_data:/data

volumes:
  graphiti_neo4j_data:
